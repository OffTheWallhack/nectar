<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4ebdd" />
  <title>Profil — Nectar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="styles.css" />
  <script src="boot.js"></script>
</head>
<body>
  <div class="app-shell has-nav" id="app-shell">
    <header class="topbar">
      <a href="feed.html" class="back-link hidden" id="back-link" aria-label="Späť na feed">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <span class="topbar-title" id="top-title">Profil</span>
      <div class="topbar-actions">
        <a href="settings.html" class="icon-btn" id="settings-link" title="Nastavenia" aria-label="Nastavenia">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9c.3.6.9 1 1.6 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
        </a>
      </div>
    </header>

    <!-- Pull-down one-time invite QR (own profile only) -->
    <div class="qr-invite hidden" id="qr-invite" aria-hidden="true" role="region" aria-label="Dočasná pozvánka QR">
      <button type="button" class="qr-pull-hint" id="qr-pull-hint" aria-expanded="false" aria-controls="qr-invite-body">
        <span class="qr-pull-handle" aria-hidden="true"></span>
        <span class="qr-pull-hint-text">Potiahni dole pre QR</span>
      </button>
      <div class="qr-invite-body" id="qr-invite-body">
        <div class="qr-invite-card" id="qr-invite-card">
          <div class="qr-canvas-wrap">
            <canvas id="qr-canvas" width="156" height="156" aria-hidden="true"></canvas>
          </div>
          <div class="qr-invite-kicker">Pozvi priateľa</div>
          <div class="qr-invite-ttl" id="qr-ttl">Platné 2 min</div>
          <div class="qr-invite-token" id="qr-token">···· · ····</div>
          <p class="qr-invite-note">Jednorazový kód pre toto stretnutie</p>
        </div>
      </div>
    </div>

    <div class="profile-cover" id="profile-cover"></div>
    <div class="profile-header" id="profile-header"></div>

    <div class="tabs" id="tabs">
      <button type="button" class="tab active" data-tab="photos">Fotky</button>
      <button type="button" class="tab" data-tab="badges">Odznaky</button>
    </div>

    <div class="tab-panel active" id="panel-photos">
      <div class="photo-grid" id="photo-grid"></div>
    </div>

    <div class="tab-panel" id="panel-badges">
      <div class="section-head"><span class="section-title">Získané</span></div>
      <div class="badge-shelf" id="badge-shelf"></div>
      <div class="section-head"><span class="section-title">Zatiaľ nezískané</span></div>
      <div class="badge-shelf" id="badge-locked"></div>
      <p class="empty-state" style="padding-top:4px">
        Odznaky sú za skutočné veci — nie za čas strávený v aplikácii.
      </p>
    </div>

    <nav class="bottom-nav" id="bottom-nav"></nav>
  </div>

  <!-- Edit modal -->
  <div class="modal-overlay" id="edit-modal">
    <div class="modal">
      <h3>Upraviť profil</h3>
      <div class="form-group">
        <label for="edit-name">Meno</label>
        <input class="form-input" id="edit-name" type="text" />
      </div>
      <div class="form-group">
        <label for="edit-status">Status</label>
        <input class="form-input" id="edit-status" type="text" maxlength="80" />
      </div>
      <div class="form-group">
        <label for="edit-place">Pripnuté miesto</label>
        <input class="form-input" id="edit-place" type="text" />
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="edit-cancel">Zrušiť</button>
        <button type="button" class="btn btn-primary" id="edit-save">Uložiť</button>
      </div>
    </div>
  </div>

  <script src="vendor/qrcode.js"></script>
  <script src="app.js"></script>
  <script src="invite-qr.js"></script>
  <script>
    (function () {
      var N = window.Nectar;
      if (!N.requireAuth()) return;

      var userId = new URLSearchParams(window.location.search).get('user');
      var isOwn = !userId || userId === 'me';

      if (isOwn) {
        var qrPanel = document.getElementById('qr-invite');
        qrPanel.classList.remove('hidden');
        qrPanel.setAttribute('aria-hidden', 'false');
        if (window.NectarInviteQr) window.NectarInviteQr.init();
      }

      var person, profile;
      if (isOwn) {
        profile = N.getProfile();
        person = {
          id: 'me', name: profile.name, avatar: profile.avatar, cover: profile.cover,
          status: profile.status, numericId: profile.numericId, place: profile.place,
          badges: profile.badges || []
        };
        N.renderBottomNav('profile');
      } else {
        person = N.findPerson(userId);
        if (!person) {
          document.getElementById('profile-header').innerHTML =
            '<p class="empty-state">Profil sa nenašiel.</p>';
          N.renderBottomNav('feed');
          return;
        }
        document.getElementById('settings-link').classList.add('hidden');
        document.getElementById('back-link').classList.remove('hidden');
        N.renderBottomNav('feed');
      }

      document.title = person.name + ' — Nectar';
      document.getElementById('top-title').textContent = N.firstName(person.name);
      document.getElementById('profile-cover').style.backgroundImage =
        'url(' + (person.cover || 'https://picsum.photos/seed/nectar-cover-' + person.id + '/800/300') + ')';

      function renderHeader() {
        var views = N.getViews();
        var myPosts = N.getPosts().filter(function (p) {
          return isOwn ? (p.authorId === 'me' || p.isMine) : p.authorId === person.id;
        }).length;

        var actions = isOwn
          ? '<button type="button" class="btn btn-secondary btn-sm" id="btn-edit">Upraviť profil</button>' +
            '<a href="friends.html" class="btn btn-secondary btn-sm">Priatelia</a>' +
            '<a href="spaces.html" class="btn btn-secondary btn-sm">Priestory</a>'
          : '<a href="conversation.html?user=' + person.id + '" class="btn btn-primary btn-sm">Napísať</a>' +
            '<button type="button" class="btn btn-secondary btn-sm" id="btn-tag">Zmeniť kruh</button>';

        /* A profile-photo ring marks a major achievement — the brief's "border badge". */
        var major = N.topBadge(person);
        var avatarHtml = major && major.major
          ? '<span class="avatar-ring"><img class="avatar avatar-lg" src="' + person.avatar + '" alt="" /></span>'
          : '<img class="avatar avatar-lg" src="' + person.avatar + '" alt="" />';

        document.getElementById('profile-header').innerHTML =
          '<div class="profile-avatar-wrap">' + avatarHtml + '</div>' +
          '<div class="profile-name">' + N.escapeHtml(person.name) + N.badgeChip(person) + '</div>' +
          '<div class="profile-id">#' + N.escapeHtml(person.numericId || '—') + '</div>' +
          '<div class="profile-status">' + N.escapeHtml(person.status || '') + '</div>' +
          '<div class="profile-stats">' +
            '<div class="profile-stat"><span class="num">' + myPosts + '</span><span class="lbl">Fotiek</span></div>' +
            '<div class="profile-stat"><span class="num">' + (person.badges || []).length + '</span><span class="lbl">Odznakov</span></div>' +
            '<div class="profile-stat"><span class="num">' + (isOwn ? views.total : 128) + '</span><span class="lbl">Návštev</span></div>' +
          '</div>' +
          (isOwn ? '<p class="step-hint">Profil si dnes pozrelo ' + views.today + ' ľudí.</p>' : '') +
          '<div class="profile-actions">' + actions + '</div>' +
          (person.place
            ? '<div class="pinned-place">' + N.ICONS.pinMap + N.escapeHtml(person.place) + '</div>'
            : '');

        if (isOwn) document.getElementById('btn-edit').onclick = openEdit;
        else document.getElementById('btn-tag').onclick = function () {
          N.showToast('Kruhy spravuješ v Priateľoch');
        };
      }

      function renderGrid() {
        var imgs = [];
        var mine = N.getPosts().filter(function (p) {
          return isOwn ? (p.authorId === 'me' || p.isMine) : p.authorId === person.id;
        });
        mine.forEach(function (p) { imgs.push(p.image); });
        var seed = isOwn ? 'nectar-me-grid' : 'nectar-' + person.id + '-g';
        while (imgs.length < 9) {
          imgs.push('https://picsum.photos/seed/' + seed + imgs.length + '/400');
        }
        document.getElementById('photo-grid').innerHTML = imgs.slice(0, 9).map(function (src) {
          return '<img src="' + src + '" alt="" loading="lazy" />';
        }).join('');
      }

      function renderBadges() {
        var owned = person.badges || [];
        document.getElementById('badge-shelf').innerHTML = owned.map(function (id) {
          var b = N.badge(id);
          if (!b) return '';
          return '<div class="badge-card' + (b.major ? ' major' : '') + '">' +
            '<span class="glyph">' + b.glyph + '</span>' +
            '<div class="badge-name">' + N.escapeHtml(b.name) + '</div>' +
            '<div class="badge-when">' + N.escapeHtml(b.when) + '</div>' +
          '</div>';
        }).join('') || '<p class="empty-state" style="padding:8px 14px">Zatiaľ žiadne odznaky.</p>';

        document.getElementById('badge-locked').innerHTML = Object.keys(N.BADGES)
          .filter(function (id) { return owned.indexOf(id) === -1; })
          .map(function (id) {
            var b = N.BADGES[id];
            return '<div class="badge-card locked">' +
              '<span class="glyph">' + b.glyph + '</span>' +
              '<div class="badge-name">' + N.escapeHtml(b.name) + '</div>' +
              '<div class="badge-when">' + N.escapeHtml(b.when) + '</div>' +
            '</div>';
          }).join('');
      }

      document.getElementById('tabs').addEventListener('click', function (e) {
        var tab = e.target.closest('.tab');
        if (!tab) return;
        var key = tab.getAttribute('data-tab');
        document.querySelectorAll('.tab').forEach(function (t) { t.classList.remove('active'); });
        tab.classList.add('active');
        document.querySelectorAll('.tab-panel').forEach(function (p) { p.classList.remove('active'); });
        document.getElementById('panel-' + key).classList.add('active');
      });

      function openEdit() {
        var p = N.getProfile();
        document.getElementById('edit-name').value = p.name;
        document.getElementById('edit-status').value = p.status;
        document.getElementById('edit-place').value = p.place || '';
        document.getElementById('edit-modal').classList.add('open');
      }

      document.getElementById('edit-cancel').onclick = function () {
        document.getElementById('edit-modal').classList.remove('open');
      };
      document.getElementById('edit-modal').addEventListener('click', function (e) {
        if (e.target === this) this.classList.remove('open');
      });
      document.getElementById('edit-save').onclick = function () {
        var p = N.getProfile();
        p.name = document.getElementById('edit-name').value.trim() || p.name;
        p.status = document.getElementById('edit-status').value.trim();
        p.place = document.getElementById('edit-place').value.trim();
        N.saveProfile(p);
        var sess = N.getSession();
        if (sess) { sess.name = p.name; N.setSession(sess); }
        person.name = p.name;
        person.status = p.status;
        person.place = p.place;
        document.getElementById('edit-modal').classList.remove('open');
        document.getElementById('top-title').textContent = N.firstName(p.name);
        renderHeader();
        N.showToast('Profil uložený', '✓');
      };

      renderHeader();
      renderGrid();
      renderBadges();
    })();
  </script>
</body>
</html>
