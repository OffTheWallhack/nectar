<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Nectar — Pokojný priestor</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <div class="landing" id="landing-home">
      <div class="landing-logo">Nectar</div>
      <p class="landing-tagline">Pokojný priestor na rozhovory a fotky. Bez reklám. Bez algoritmu.</p>
      <p class="landing-price"><strong>1 €</strong> / mesiac</p>
      <div class="landing-actions">
        <button type="button" class="btn btn-primary btn-block" id="btn-create">Vytvoriť účet</button>
        <button type="button" class="btn btn-secondary btn-block" id="btn-login">Prihlásiť sa</button>
      </div>
    </div>

    <!-- Create account -->
    <div class="landing landing-panel" id="panel-create">
      <div class="landing-logo" style="font-size:1.8rem;margin-bottom:8px;">Nectar</div>
      <h2>Vytvoriť účet</h2>
      <form id="form-create">
        <div class="form-group">
          <label for="create-name">Meno</label>
          <input class="form-input" id="create-name" type="text" required placeholder="Tvoje meno" autocomplete="name" />
        </div>
        <div class="form-group">
          <label for="create-email">E-mail</label>
          <input class="form-input" id="create-email" type="email" required placeholder="ty@email.sk" autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="create-pass">Heslo</label>
          <input class="form-input" id="create-pass" type="password" required placeholder="••••••••" minlength="4" autocomplete="new-password" />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Pokračovať na platbu</button>
        <button type="button" class="btn btn-ghost btn-block" id="back-from-create">Späť</button>
      </form>
    </div>

    <!-- Login -->
    <div class="landing landing-panel" id="panel-login">
      <div class="landing-logo" style="font-size:1.8rem;margin-bottom:8px;">Nectar</div>
      <h2>Prihlásiť sa</h2>
      <form id="form-login">
        <div class="form-group">
          <label for="login-email">E-mail</label>
          <input class="form-input" id="login-email" type="email" required placeholder="ty@email.sk" value="demo@nectar.sk" autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="login-pass">Heslo</label>
          <input class="form-input" id="login-pass" type="password" required placeholder="••••••••" value="demo" autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Prihlásiť sa</button>
        <button type="button" class="btn btn-ghost btn-block" id="back-from-login">Späť</button>
      </form>
    </div>

    <!-- Paywall -->
    <div class="landing landing-panel" id="panel-pay">
      <div class="landing-logo" style="font-size:1.8rem;margin-bottom:8px;">Nectar</div>
      <h2>Predplatné</h2>
      <div class="paywall-box">
        <p>Plný prístup bez reklám</p>
        <div class="price-big">1 €</div>
        <p class="price-note">mesačne · zrušiteľné kedykoľvek</p>
        <div class="mock-card">
          <strong style="color:var(--text);">Mock platba</strong><br />
          Karta: •••• 4242<br />
          Platnosť: 12/28 · CVC: •••
        </div>
      </div>
      <button type="button" class="btn btn-primary btn-block" id="btn-pay">Zaplatiť 1 € a vstúpiť</button>
      <button type="button" class="btn btn-ghost btn-block" id="back-from-pay">Späť</button>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    (function () {
      var N = window.Nectar;
      var pending = null;

      // Already logged in + paid → feed
      var s = N.getSession();
      if (s && s.paid) {
        window.location.href = 'feed.html';
        return;
      }

      function show(id) {
        document.querySelectorAll('.landing').forEach(function (el) {
          el.classList.remove('active');
          if (el.id !== 'landing-home') el.style.display = 'none';
        });
        var home = document.getElementById('landing-home');
        if (id === 'landing-home') {
          home.style.display = 'flex';
          return;
        }
        home.style.display = 'none';
        var panel = document.getElementById(id);
        panel.style.display = 'flex';
        panel.classList.add('active');
      }

      document.getElementById('btn-create').onclick = function () { show('panel-create'); };
      document.getElementById('btn-login').onclick = function () { show('panel-login'); };
      document.getElementById('back-from-create').onclick = function () { show('landing-home'); };
      document.getElementById('back-from-login').onclick = function () { show('landing-home'); };
      document.getElementById('back-from-pay').onclick = function () { show('panel-create'); };

      document.getElementById('form-create').onsubmit = function (e) {
        e.preventDefault();
        pending = {
          name: document.getElementById('create-name').value.trim(),
          email: document.getElementById('create-email').value.trim(),
          paid: false
        };
        show('panel-pay');
      };

      document.getElementById('form-login').onsubmit = function (e) {
        e.preventDefault();
        var email = document.getElementById('login-email').value.trim();
        N.setSession({
          name: 'Demo používateľ',
          email: email,
          paid: true,
          loggedInAt: Date.now()
        });
        window.location.href = 'feed.html';
      };

      document.getElementById('btn-pay').onclick = function () {
        var data = pending || { name: 'Nový používateľ', email: 'novy@nectar.sk' };
        N.setSession({
          name: data.name,
          email: data.email,
          paid: true,
          loggedInAt: Date.now()
        });
        N.showToast('Vitaj v Nectare!');
        setTimeout(function () { window.location.href = 'feed.html'; }, 400);
      };
    })();
  </script>
</body>
</html>
