<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Konverzácia — Nectar</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a href="messages.html" class="back-link" aria-label="Späť">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <a class="chat-header-user" id="chat-user" href="#">
        <img class="avatar avatar-sm" id="chat-avatar" src="" alt="" />
        <span class="chat-header-name" id="chat-name">…</span>
      </a>
      <span style="width:28px"></span>
    </header>

    <div class="chat-thread" id="chat-thread"></div>

    <div class="chat-compose">
      <button type="button" class="chat-photo-btn" id="btn-photo" title="Fotka (ukážka)" aria-label="Pridať fotku">
        <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
      </button>
      <input type="text" id="chat-input" placeholder="Napíš správu…" autocomplete="off" />
      <button type="button" class="chat-send" id="chat-send" disabled>Poslať</button>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    (function () {
      var N = window.Nectar;
      if (!N.requireAuth()) return;

      var params = new URLSearchParams(window.location.search);
      var userId = params.get('user') || 'maria';
      var person = N.findPerson(userId);
      if (!person) {
        document.getElementById('chat-name').textContent = 'Neznámy';
        return;
      }

      document.getElementById('chat-name').textContent = person.name;
      document.getElementById('chat-avatar').src = person.avatar;
      document.getElementById('chat-user').href = 'profile.html?user=' + person.id;
      document.title = person.name + ' — Nectar';

      var thread = document.getElementById('chat-thread');
      var input = document.getElementById('chat-input');
      var sendBtn = document.getElementById('chat-send');

      function render() {
        var msgs = N.getMessages(person.id);
        thread.innerHTML = msgs.map(function (m) {
          var cls = m.from === 'me' ? 'me' : 'them';
          return '<div class="bubble ' + cls + '">' + escapeHtml(m.text) +
            '<div class="bubble-time">' + (m.time || '') + '</div></div>';
        }).join('');
        thread.scrollTop = thread.scrollHeight;
      }

      function escapeHtml(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      }

      function nowTime() {
        var d = new Date();
        return d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
      }

      function send() {
        var text = input.value.trim();
        if (!text) return;
        N.saveMessage(person.id, { from: 'me', text: text, time: nowTime() });
        input.value = '';
        sendBtn.disabled = true;
        render();
      }

      input.addEventListener('input', function () {
        sendBtn.disabled = !input.value.trim();
      });
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); send(); }
      });
      sendBtn.addEventListener('click', send);

      document.getElementById('btn-photo').addEventListener('click', function () {
        N.showToast('Odoslanie fotky — ukážka (nie je v MVP)');
      });

      render();
      setTimeout(function () { thread.scrollTop = thread.scrollHeight; }, 50);
    })();
  </script>
</body>
</html>
